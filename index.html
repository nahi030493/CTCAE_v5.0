<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
main{max-width:820px;margin:0 auto;padding:18px 14px 48px}
h1{font-size:1.35rem;margin:0 0 2px}
.sub{color:var(--mu);margin:0 0 14px;font-size:.88rem}
input[type=search],select{width:100%;font-size:1rem;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row select{flex:1 1 220px;width:auto}
.seg{display:flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--tx);padding:10px 12px;font-size:.9rem;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:5px 11px;font-size:.85rem;cursor:pointer}
.cnt{color:var(--mu);font-size:.82rem;margin:6px 2px 10px}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px}
summary{list-style:none;cursor:pointer;padding:12px 14px}
summary::-webkit-details-marker{display:none}
.en{font-weight:600}.zh{color:var(--mu);font-size:.92rem}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{background:var(--tag);color:var(--tagtx);border-radius:6px;padding:1px 8px;font-size:.74rem}
.body{padding:0 14px 14px}
.gr{border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:.9rem}
.gr b{display:inline-block;min-width:4.6em}
.gr.g1{background:var(--g1)}.gr.g2{background:var(--g2)}.gr.g3{background:var(--g3)}.gr.g4{background:var(--g4)}.gr.g5{background:var(--g5)}
.gr .s{display:block;color:var(--mu);font-size:.8rem;margin-top:2px}
.lbl{font-size:.8rem;color:var(--mu);margin:10px 0 2px;font-weight:600}
.edu{border:1px dashed var(--bd);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:.9rem}
.edu ul{margin:4px 0 8px;padding-left:1.2em}
.warn{background:var(--warn);color:var(--warntx);border-radius:8px;padding:6px 10px;font-size:.78rem;margin-bottom:8px}
button.more{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:.95rem;cursor:pointer}
.note{margin-top:22px;border-top:1px solid var(--bd);padding-top:12px;color:var(--mu);font-size:.8rem}
.rel{margin-top:6px}.rel .chip{margin:2px 4px 2px 0;font-size:.8rem}
</style>
</head>
<body>
<main>
<h1>CTCAE v5.0 症狀查詢</h1>
<p class="sub">輸入症狀（中文、英文、口語都可以），列出可能對應的 CTCAE 項目、Grade 1–5 定義與護理衛教。</p>
<input id="q" type="search" placeholder="例如：手腳麻、想吐、掉髮、mouth sores" autocomplete="off">
<div class="row"><select id="soc"></select><div class="seg" id="lang"><button data-l="both" class="on">雙語</button><button data-l="zh">中文</button><button data-l="en">English</button></div></div>
<div class="chips" id="chips"></div>
<div class="cnt" id="cnt"></div>
<div id="out"></div>
<p class="note">⚠️ 本工具僅供整理與查詢參考，不能取代醫師或護理人員的判斷。分級定義取自 CTCAE v5.0（2017 年 11 月 27 日）英文版及所提供之中文版（繁體字，用語沿用原譯文），症狀同義詞與衛教內容為草稿，使用前須經專業人員審閱。</p>
</main>

併發燒、腹痛或頭暈"]},"Constipation":{"s":"便秘可能與藥物、活動量減少或飲水不足有關。","c":["依身體狀況增加水分與纖維攝取","在可行範圍內規律活動","依醫囑使用軟便劑或緩瀉劑"],"w":["多日未排便且腹脹、腹痛","嘔吐或無法排氣"]},"Fatigue":{"s":"疲倦是治療期間最常見的症狀之一，休息後不一定完全改善。","c":["安排活動與休息交替，優先做重要的事","在可承受範圍內維持輕度活動","保持均衡飲食與足夠水分"],"w":["突然明顯加重","合併呼吸喘、胸悶、頭暈或發燒"]},"Fever":{"s":"成人耳溫（口溫）正常約 37°C ± 0.5°C，38°C 以上稱為發燒。","pl":"發燒過程與症狀","p":["開始期（體溫上升）：皮膚血管收縮，皮膚變冷、蒼白；肌肉收縮、發抖、寒顫；代謝增加，呼吸與脈搏加快，因呼吸變快而口渴","極熱期（體溫最高）：皮膚發紅發熱，呼吸心跳加快、頭痛不安、昏睡；高燒時可能神智不清、譫妄、幻覺、失去定向感；時間拉長可能脫水、皮膚及黏膜乾裂、嘴唇龜裂、嘴角潰瘍","退熱期（體溫下降）：出汗、寒顫減緩，應盡速更換乾淨衣物及被單，保持清潔乾燥"],"c":["環境：維持安靜，室溫約 24–27°C，空氣流通，避免風口直吹病人","退熱期減少被蓋衣物；若出現寒顫則加強保暖，必要時可使用烤燈，但須隔著被單，切勿直接照射皮膚以免燙傷","水分與營養：在無其他病情限制下，一天至少攝入 2500–3000 ml 以上水分；攝取高蛋白、高維生素、低脂肪、清淡食物，少量多餐","冰枕：僅能讓發熱階段較舒適，對病情改善無明顯證據；低溫可能使頭頸部血管快速收縮而更不適，可改用退熱貼（效果較溫和）"],"wl":"用藥提醒","w":["住院期間應依醫囑服用退燒藥，切勿擅自服用，以免掩蓋原有的發燒、影響醫師診斷"],"src":"來源：台大醫院護理部 14B 病房〈發燒症狀處理護理指導〉，2015 年 11 月 15 日修正；專業審閱：護理、醫師、營養師。此為一般發燒護理指導，未包含化療後白血球低下發燒的通報標準，請依貴單位規範補充。"},"Peripheral sensory neuropathy":{"s":"手腳麻、刺痛或感覺變差，可能與某些藥物有關。","c":["注意保暖並保護手腳，避免燙傷與受傷","穿著合適的鞋襪，在家中保持動線平整","使用溫水洗澡前先以手肘或溫度計確認水溫"],"w":["麻木範圍擴大或影響拿東西、扣釦子","走路不穩、容易跌倒"]},"Alopecia":{"s":"部分治療會造成掉髮，多數在治療結束後逐漸長回。","c":["使用溫和洗髮用品與柔軟梳子","外出時可使用帽子或假髮，並注意防曬","可事先與醫療團隊討論頭皮保護方式"],"w":["頭皮紅腫、疼痛或有傷口"]},"Palmar-plantar erythrodysesthesia syndrome":{"s":"手足症候群會使手掌與腳底紅、痛或脫皮。","c":["勤塗保濕乳液，避免摩擦、重壓與過熱","避免長時間泡熱水","穿著寬鬆柔軟的鞋襪與手套"],"w":["疼痛影響行走或日常活動","出現水泡、破皮或疑似感染"]},"Rash maculo-papular":{"s":"皮疹可能與藥物反應有關。","c":["保持皮膚清潔、保濕","避免抓搔與日曬","穿著寬鬆棉質衣物"],"w":["皮疹快速擴散或合併發燒","出現水泡、黏膜破皮","臉或喉嚨腫脹、呼吸困難"]},"Anorexia":{"s":"食慾下降會影響營養與體力。","c":["少量多餐，選擇高熱量、高蛋白的點心","在較有胃口的時段多吃","可與營養師討論營養補充方式"],"w":["進食量持續很少或體重明顯下降"]},"Gastric ulcer":{"s":"消化性潰瘍是食道、胃、十二指腸的黏膜受到胃液腐蝕，造成糜爛與破損，多數發生在胃或十二指腸，少數在食道。胃潰瘍常在吃飽後不舒服，十二指腸潰瘍常在肚子餓時不舒服。","pl":"常見症狀","p":["疼痛：燒灼痛、鈍痛、壓迫感或刺痛，常在飯後 2–3 小時或午夜胃排空時特別明顯","便血或吐血：焦油般深黑的大便是出血的表現；嚴重出血會有貧血症狀（衰弱、頭暈、心跳加速、昏厥），急性大量出血甚至可能休克","其他：體重減輕、食慾下降、嘔吐","很多人完全沒有症狀，直到出血或穿孔才被診斷；部分胃癌的症狀與潰瘍很類似，不能只憑症狀判斷，需靠進一步檢查"],"x":[["可能原因",["幽門螺旋桿菌（H. pylori）感染","藥物：非類固醇抗炎藥（如 Naproxen、Ibuprofen）、類固醇、阿斯匹靈","吸菸與酗酒","情緒緊張、心理壓力、飲食無定時或暴飲暴食，使胃液分泌增加；燒傷、手術、嚴重疾病也可能引起"]],["檢查與治療",["通常先做上消化道攝影或胃鏡；胃潰瘍須先切片排除惡性腫瘤","幽門螺旋桿菌檢查：侵襲性（胃鏡切片、快速尿素酶測試）或非侵襲性（抽血驗抗體、13C 尿素呼氣試驗）","無 H. pylori：以質子幫浦抑制劑（PPI）治療 1–4 個月，再以胃鏡追蹤","有 H. pylori：三合一或四合一療法（一種制酸劑加 2–3 種抗生素）1–2 週，6–8 週後需胃鏡追蹤，殺菌率約 80–90%","藥物可能引起頭暈、腹瀉或頭痛，無法忍受請告知醫師處理，不要自行停藥","若潰瘍由非類固醇抗炎藥引起，應避免使用該類藥物"]]],"cl":"日常照護","c":["飲食：出血至止血後 2–3 天以流質為佳；止血後 2–3 天至恢復期以軟質或溫和飲食為主；恢復期與一般飲食相似，除非感到不適","溫和飲食：無刺激性；低纖維質（避免麩皮、豆類與水果外皮、粗纖維蔬菜）；易消化（蒸、煮、燉、糊泥狀，動物筋與膠不易消化）","定時定量、少量多餐，均衡攝取各類食物","細嚼慢嚥、心情放鬆，飯後略作休息再工作","不抽菸，不喝酒、茶、咖啡等刺激物","儘可能避免非類固醇抗炎藥、類固醇、阿斯匹靈"],"wl":"就醫與用藥提醒","w":["依醫師指示服藥，不可自行停藥","反覆發生腹痛或大便顏色改變時，立即就醫"],"src":"來源：台大醫院 13AB 病房〈消化性潰瘍病人護理指導〉，2015 年 11 月 27 日修正。此為一般消化性潰瘍衛教，未涵蓋治療藥物引起之潰瘍的處置與通報標準，請依貴單位規範補充。"},"Duodenal ulcer":{"s":"消化性潰瘍是食道、胃、十二指腸的黏膜受到胃液腐蝕，造成糜爛與破損，多數發生在胃或十二指腸，少數在食道。胃潰瘍常在吃飽後不舒服，十二指腸潰瘍常在肚子餓時不舒服。","pl":"常見症狀","p":["疼痛：燒灼痛、鈍痛、壓迫感或刺痛，常在飯後 2–3 小時或午夜胃排空時特別明顯","便血或吐血：焦油般深黑的大便是出血的表現；嚴重出血會有貧血症狀（衰弱、頭暈、心跳加速、昏厥），急性大量出血甚至可能休克","其他：體重減輕、食慾下降、嘔吐","很多人完全沒有症狀，直到出血或穿孔才被診斷；部分胃癌的症狀與潰瘍很類似，不能只憑症狀判斷，需靠進一步檢查"],"x":[["可能原因",["幽門螺旋桿菌（H. pylori）感染","藥物：非類固醇抗炎藥（如 Naproxen、Ibuprofen）、類固醇、阿斯匹靈","吸菸與酗酒","情緒緊張、心理壓力、飲食無定時或暴飲暴食，使胃液分泌增加；燒傷、手術、嚴重疾病也可能引起"]],["檢查與治療",["通常先做上消化道攝影或胃鏡；胃潰瘍須先切片排除惡性腫瘤","幽門螺旋桿菌檢查：侵襲性（胃鏡切片、快速尿素酶測試）或非侵襲性（抽血驗抗體、13C 尿素呼氣試驗）","無 H. pylori：以質子幫浦抑制劑（PPI）治療 1–4 個月，再以胃鏡追蹤","有 H. pylori：三合一或四合一療法（一種制酸劑加 2–3 種抗生素）1–2 週，6–8 週後需胃鏡追蹤，殺菌率約 80–90%","藥物可能引起頭暈、腹瀉或頭痛，無法忍受請告知醫師處理，不要自行停藥","若潰瘍由非類固醇抗炎藥引起，應避免使用該類藥物"]]],"cl":"日常照護","c":["飲食：出血至止血後 2–3 天以流質為佳；止血後 2–3 天至恢復期以軟質或溫和飲食為主；恢復期與一般飲食相似，除非感到不適","溫和飲食：無刺激性；低纖維質（避免麩皮、豆類與水果外皮、粗纖維蔬菜）；易消化（蒸、煮、燉、糊泥狀，動物筋與膠不易消化）","定時定量、少量多餐，均衡攝取各類食物","細嚼慢嚥、心情放鬆，飯後略作休息再工作","不抽菸，不喝酒、茶、咖啡等刺激物","儘可能避免非類固醇抗炎藥、類固醇、阿斯匹靈"],"wl":"就醫與用藥提醒","w":["依醫師指示服藥，不可自行停藥","反覆發生腹痛或大便顏色改變時，立即就醫"],"src":"來源：台大醫院 13AB 病房〈消化性潰瘍病人護理指導〉，2015 年 11 月 27 日修正。此為一般消化性潰瘍衛教，未涵蓋治療藥物引起之潰瘍的處置與通報標準，請依貴單位規範補充。"},"Esophageal ulcer":{"s":"消化性潰瘍是食道、胃、十二指腸的黏膜受到胃液腐蝕，造成糜爛與破損，多數發生在胃或十二指腸，少數在食道。胃潰瘍常在吃飽後不舒服，十二指腸潰瘍常在肚子餓時不舒服。","pl":"常見症狀","p":["疼痛：燒灼痛、鈍痛、壓迫感或刺痛，常在飯後 2–3 小時或午夜胃排空時特別明顯","便血或吐血：焦油般深黑的大便是出血的表現；嚴 dl，女性 12–16 g/dl）。","pl":"常見症狀","p":["一般症狀：頭暈、頭痛、疲倦、虛弱、昏昏欲睡、注意力不集中、肌肉無力，眼結膜、指甲床與臉色蒼白，毛髮脫落、舌面光滑","嚴重時：心悸、心跳加速、呼吸困難、嗜睡、意識不清、低血壓、休克","有上述症狀時，請至血液腫瘤科門診做進一步診治"],"x":[["常見原因與治療",["原因大致分兩類：紅血球製造減少（如缺鐵性、海洋性、惡性、再生不良性貧血、血液癌症）與紅血球破壞增加（如溶血性、失血性貧血）","治療目標：控制引起貧血的原因、改善症狀、預防合併症","缺鐵性貧血：經醫師評估後，可口服、肌肉或靜脈注射補充鐵劑，並多吃高鐵食物","惡性貧血（缺乏維生素 B12 與葉酸）：均衡飲食，或注射／口服 B12、葉酸","溶血性貧血：去除導因，避免可能引起溶血的食物或藥物（如蠶豆及相關製品、磺胺類藥物、樟腦丸）","失血性貧血：針對出血原因止血，失血過多時需輸血","海洋性貧血與再生不良性貧血：依嚴重程度與醫師討論治療方向（可能需輸血或骨髓移植）"]]],"cl":"照護原則","c":["均衡飲食，選擇有助造血的食物：蛋白質（奶、蛋、魚、肉、豆）、高鐵（紅肉、全穀類、蛋黃、深色蔬菜、葡萄乾）、高熱量、葉酸（綠色蔬菜、莢豆類、動物性蛋白質）、維生素 C 或 B12（肝、魚、家禽、蛋類）","充足休息、養成規律排便習慣，維持良好衛生習慣以避免感染","避免快速變換動作，預防頭暈與跌倒","找出貧血的原因（如食物含鐵不足、出血、惡性疾病），才能對症下藥"],"wl":"用藥與追蹤","w":["遵照醫師指示服用鐵劑、葉酸、維生素 B12 等藥物，並定時返診追蹤"],"src":"來源：臺北榮民總醫院 iHealth 護理指導〈貧血衛教〉（Care of Anemia），頁面未標示修訂日期。此為一般貧血衛教，非針對化療引起貧血的處置，也未列出需立即就醫的具體標準，請依貴單位規範補充。"},"Nausea":{"x":[["噁心、嘔吐原因",["腫瘤：如消化道或腹部腫瘤、腦瘤","化學治療：最常見的副作用，藥物種類與劑量都會影響程度；藥物致吐性分為高、中、低、微致吐性四等級","放射治療：與照射部位、次數、劑量有關；照射腦部、消化系統、肝臟等部位，發生機率較高","癌症治療相關藥物：如標靶及免疫治療藥物","其他藥物：如阿斯匹靈類消炎止痛藥、某些抗生素","體內電解質不平衡：如腹瀉脫水而未及時補充水分","腸胃道障礙：治療、手術或腫瘤引起的腸阻塞，或便秘、糞便填塞","情緒：擔憂疾病變化而產生的壓力與焦慮；若第一次治療經驗很不適，之後可能在給藥前就聯想到不適而開始嘔吐（預期性嘔吐）","其他：如感染、腸胃炎、腎臟疾病等"]]],"cl":"飲食建議","c":["清淡飲食、少量多餐（每 2–3 小時進食，每次 5–6 分飽），細嚼慢嚥，避免過度飽脹","若為化療藥物引起，治療前避免吃太多；餐前、餐中、餐後避免過度喝水，以減少飽脹感","過甜、油膩、重口味及辛辣刺激的食物可能引起噁心嘔吐；可嘗試口含檸檬糖、薄荷糖、喉糖或碎冰塊，降低噁心感","稍有酸味的食物（如酸梅、陳皮、無花果），或微酸、冰涼、甜度不高並經稀釋的飲料，可能抑制噁心嘔吐，但須視個人接受程度","過熱的食物味道較明顯，室溫或較涼的食物較不易引起噁心，也更容易接受","多次攝取小份量、高熱量、高蛋白的點心或飲品，如布丁、蒸蛋、起司條","飯後 1–2 小時採坐姿休息，不要馬上躺下，以減少胃酸逆流造成的噁心","食物宜新鮮、時常變換、隨餐烹調，減少重複加熱，否則味道改變更容易引起不適","嘔吐時不宜進食；停止嘔吐約 1–2 小時後，再嘗試少量較乾的固體食物（如白吐司、蘇打餅乾）或小量飲水，觀察反應","嚴重嘔吐時，應補充適量水分與含鉀較高的食物，如香蕉、葡萄"],"src":"來源：台灣癌症基金會「癌症e學苑」〈噁心、嘔吐的照護〉，文／李佩儒護理師、曾雅欣護理師；頁面未標示修訂日期。本頁僅摘錄「噁心、嘔吐原因」與「飲食建議」，其餘（如返診就醫標準、用藥）請依貴單位規範補充。"},"Vomiting":{"x":[["噁心、嘔吐原因",["腫瘤：如消化道或腹部腫瘤、腦瘤","化學治療：最常見的副作用，藥物種類與劑量都會影響程度；藥物致吐性分為高、中、低、微致吐性四等級","放射治療：與照射部位、次數、劑量有關；照射腦部、消化系統、肝臟等部位，發生機率較高","癌症治療相關藥物：如標靶及免疫治療藥物","其他藥物：如阿斯匹靈類消炎止痛藥、某些抗生素","體內電解質不平衡：如腹瀉脫水而未及時補充水分","腸胃道障礙：治療、手術或腫瘤引起的腸阻塞，或便秘、糞便填塞","情緒：擔憂疾病變化而產生的壓力與焦慮；若第一次治療經驗    if(t.length>1&&o.dz.includes(t)){s+=8;why.add("定義")}
  }else if(t.length>1){
   if(o.tl===t)s+=100;else if(o.ws.some(w=>w.startsWith(t)))s+=70;else if(o.tl.includes(t))s+=55;
   else if(o.se.some(x=>x.includes(t))){s+=50;why.add("同義詞")}
   else if(t.length>=4){const L=t.length>=7?2:1;if(o.ws.concat(o.se.flatMap(x=>x.split(/\s+/))).some(w=>Math.abs(w.length-t.length)<=L&&lev(w,t)<=L)){s+=35;why.add("相近")}}
   if(o.de.includes(t))s+=6;
   if(s&&!why.size)why.add("名稱");
  }
 }
 if(qc.length>=3)for(const x of o.sc)if(x.length>1&&qc.includes(x)){s+=60+x.length;why.add("同義詞")}
 return{s,why:[...why]}}
